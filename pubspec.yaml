name: VonAbisZ
description: "A new Flutter project."
version: 1.0.0+3

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons:
  flutter_screenutil:
  get:
  google_fonts:
  image_picker:
  shared_preferences:
  web_socket_channel:
  geolocator:
  dio:
  firebase_core:
  firebase_auth:
  google_sign_in:
  cloud_firestore:
  google_maps_flutter:
  flutter_map:
  latlong2:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/AppStore.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/AppStore.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/auth/
    - assets/images/splash/
    - assets/icons/
    - assets/images/profile/
    - assets/images/professional/


